  admin:
    - endpoint: "/WsAdmin/api/1.0/led"
      key: "admin.led_status"
      entity_type: sensor
      name: "LED Status"
      i18n:
        de: "LED Status"
        en: "LED Status"
      device_class: null
      state_class: null
      group: system
      experience_minimum: service

    - endpoint: "/WsAdmin/api/1.0/settings"
      key: "admin.settings"
      entity_type: sensor
      name: "System Settings"
      i18n:
        de: "Systemeinstellungen"
        en: "System Settings"
      device_class: null
